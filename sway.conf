# SPDX-License-Identifier: GPL-2.0-or-later
font pango:Sans 13
default_border pixel 0
default_floating_border pixel 2
workspace_layout tabbed
focus_follows_mouse no
xwayland enable

workspace 1:Home
assign [app_id="^org[.]zavo[.]Shell$"] workspace 1:Home
bindsym Mod4+Home workspace 1:Home
bindsym Mod4+Tab workspace 2:Windows
bindsym Mod4+Shift+e exit

bar {
    position bottom
    height 54
    strip_workspace_numbers yes
    workspace_min_width 112
    colors {
        background #141127
        focused_workspace #91f5c8 #91f5c8 #102722
        active_workspace #2c2344 #2c2344 #f4efff
        inactive_workspace #141127 #141127 #e5dcf6
    }
}

exec /bin/bash "$ZAVO_LAUNCHER"
